services:
  - type: web
    name: antigravity-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEPLOY_SYNC_ID
        value: "v2.5-indices-tab-4x4-radar"
